<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tab Clipper — Okuma Listesi</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#11141d;color:#e4e6f0;min-height:100vh}
  .kapsa{max-width:760px;margin:0 auto;padding:24px 16px 60px}
  .ust{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:16px}
  .ust h1{font-size:1.4em;font-weight:800}
  .ust h1 span{color:#1db954}
  .sag{display:flex;gap:8px;align-items:center}
  .btn{padding:8px 14px;border-radius:8px;border:1px solid #2e3345;background:#1a1d27;color:#e4e6f0;cursor:pointer;font-size:0.82em;font-weight:600}
  .btn:hover{background:#242836}
  .btn.aktif{background:#1db954;border-color:#1db954;color:#fff}
  .btn.tehlike:hover{border-color:#ff6b6b;color:#ff6b6b}
  .arama{width:100%;padding:11px 14px;border-radius:10px;border:1px solid #2e3345;background:#1a1d27;color:#e4e6f0;font-size:0.9em;margin-bottom:16px}
  .arama::placeholder{color:#8b8fa8}
  .bos{text-align:center;color:#8b8fa8;padding:60px 10px;font-size:0.9em}
  .kayit{display:flex;align-items:center;gap:12px;background:#1a1d27;border:1px solid #2e3345;border-radius:12px;padding:12px 14px;margin-bottom:10px;transition:all .2s}
  .kayit.okundu{opacity:.55}
  .ikon{width:32px;height:32px;border-radius:8px;background:#242836;flex-shrink:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
  .ikon img{width:100%;height:100%;object-fit:cover}
  .bilgi{flex:1;min-width:0}
  .baslik{font-weight:700;font-size:0.92em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .url{color:#8b8fa8;font-size:0.75em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
  .meta{color:#6c7186;font-size:0.7em;margin-top:3px}
  .islem{display:flex;gap:6px;flex-shrink:0}
  .islem button{padding:6px 10px;border-radius:7px;border:none;cursor:pointer;font-size:0.75em;font-weight:600;color:#fff}
  .ac{background:#1db954}
  .ok{background:#2e3345;color:#e4e6f0}
  .sil{background:#363b4d;color:#ff6b6b}
  button.islem:hover{opacity:.85}
  .alt{position:fixed;left:0;right:0;bottom:0;background:#11141d;border-top:1px solid #2e3345;padding:10px 16px;display:flex;justify-content:space-between;align-items:center;font-size:0.78em;color:#8b8fa8}
</style>
</head>
<body>
<div class="kapsa">
  <div class="ust">
    <h1>📌 Tab Clipper <span id="sayac"></span></h1>
    <div class="sag">
      <button class="btn" id="fHepsi">Tümü</button>
      <button class="btn" id="fOkunmadi">Okunmamış</button>
      <button class="btn tehlike" id="temizle">Temizle</button>
    </div>
  </div>
  <input class="arama" id="arama" type="search" placeholder="Ara (başlık veya url)...">
  <div id="liste"><div class="bos">Yükleniyor...</div></div>
</div>
<div class="alt"><span id="bilgi">—</span><span>Tab Clipper v0.1</span></div>
<script src="panel.js"></script>
</body>
</html>
