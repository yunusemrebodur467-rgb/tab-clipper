<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<style>
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#11141d;color:#e4e6f0;width:300px;margin:0}
  .ust{padding:14px 16px 6px}
  .ust h1{font-size:1.1em;margin:0;font-weight:800}
  .ust p{color:#8b8fa8;font-size:0.78em;margin:4px 0 0}
  .alan{padding:12px 16px 16px}
  #klipBtn{width:100%;padding:12px;border:none;border-radius:10px;background:#1db954;color:#fff;font-size:0.95em;font-weight:700;cursor:pointer}
  #klipBtn:hover{opacity:.88}
  #klipBtn:disabled{opacity:.5;cursor:default}
  #durum{color:#8b8fa8;font-size:0.82em;min-height:18px;margin-top:10px;text-align:center}
  #durum.ok{color:#1db954}
  #durum.hata{color:#ff6b6b}
  #panelBtn{display:block;width:100%;margin-top:8px;padding:10px;border:1px solid #2e3345;background:transparent;color:#e4e6f0;border-radius:10px;font-size:0.85em;cursor:pointer;text-align:center}
  #panelBtn:hover{background:#242836}
</style>
</head>
<body>
<div class="ust">
  <h1>📌 Tab Clipper</h1>
  <p>Bu penceredeki tüm sekmeleri "sonra oku" listesine al.</p>
</div>
<div class="alan">
  <button id="klipBtn">📌 Tüm sekmeleri kliple</button>
  <div id="durum"></div>
  <button id="panelBtn">📋 Okuma panelini aç</button>
</div>
<script src="popup.js"></script>
</body>
</html>
